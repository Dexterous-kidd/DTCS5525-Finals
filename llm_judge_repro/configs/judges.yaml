# DEFAULT: Ollama backend. (The vLLM version of this file is configs/judges_vllm.yaml; switch with `judge_config:` in study.yaml.)
# Every decoding setting lives here, never in code defaults (Section 7 of the paper).
rotation_judges: [gpt-oss-20b, qwen3-8b]   # P3 alternates these two

judges:
  gpt-oss-20b:
    backend: ollama
    ollama_model: gpt-oss:20b          # ollama pull gpt-oss:20b
    family: gpt-oss
    core: true
    think: low                         # gpt-oss reasoning effort: low | medium | high
    max_model_len: 8192                # sent as options.num_ctx (Ollama's default 4096 would truncate prompts)
    workers: 8                         # concurrent requests; keep <= OLLAMA_NUM_PARALLEL
    sampling: {temperature: 1.0, top_p: 1.0, top_k: -1, min_p: 0.0}   # top_k <= 0 -> Ollama default applies

  qwen3-8b:
    backend: ollama
    ollama_model: qwen3:8b             # ollama pull qwen3:8b
    family: qwen
    core: true
    think: false                       # Qwen3 non-thinking mode
    max_model_len: 8192
    workers: 8
    sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0}   # model-card non-thinking settings

  gpt-oss-120b:                        # stretch judge S1: OPTIONAL, ~65 GB download, not used in the default run
    backend: ollama
    ollama_model: gpt-oss:120b
    family: gpt-oss
    core: false
    think: low
    max_model_len: 8192
    workers: 4
    sampling: {temperature: 1.0, top_p: 1.0, top_k: -1, min_p: 0.0}

  qwen3-8b-think:                      # optional sensitivity judge: run on ~200 dev battles only
    backend: ollama
    ollama_model: qwen3:8b
    family: qwen
    core: false
    sensitivity: true                  # excluded from tune/analyze; evaluated by `judgestudy sensitivity`
    think: true
    max_model_len: 12288
    max_tokens: 4096
    workers: 4
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
