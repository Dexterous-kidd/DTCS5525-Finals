# Every decoding setting lives here, never in code defaults (Section 7 of the paper).
rotation_judges: [gpt-oss-20b, qwen3-8b]   # P3 alternates these two

judges:
  gpt-oss-20b:
    hf_id: openai/gpt-oss-20b
    family: gpt-oss
    core: true
    backend: vllm
    tensor_parallel_size: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    chat_template_kwargs: {reasoning_effort: low}   # "Reasoning: low" in the harmony system block
    sampling: from_generation_config                 # temperature/top_p/top_k read from the model's generation_config.json
    sampling_fallback: {temperature: 1.0, top_p: 1.0, top_k: -1, min_p: 0.0}

  qwen3-8b:
    hf_id: Qwen/Qwen3-8B
    family: qwen
    core: true
    backend: vllm
    tensor_parallel_size: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    chat_template_kwargs: {enable_thinking: false}
    sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0}   # model-card non-thinking settings

  gpt-oss-120b:                  # stretch judge S1, one 80 GB GPU
    hf_id: openai/gpt-oss-120b
    family: gpt-oss
    core: false
    backend: vllm
    tensor_parallel_size: 1      # raise to 2 if you do not have an 80 GB card
    max_model_len: 8192
    gpu_memory_utilization: 0.92
    chat_template_kwargs: {reasoning_effort: low}
    sampling: from_generation_config
    sampling_fallback: {temperature: 1.0, top_p: 1.0, top_k: -1, min_p: 0.0}

  # Optional sensitivity judge (run on ~200 dev battles only): Qwen3-8B with thinking on.
  qwen3-8b-think:
    hf_id: Qwen/Qwen3-8B
    family: qwen
    core: false
    backend: vllm
    tensor_parallel_size: 1
    max_model_len: 12288
    gpu_memory_utilization: 0.90
    chat_template_kwargs: {enable_thinking: true}
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    max_tokens: 4096
